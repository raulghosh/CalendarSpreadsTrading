products:
  SPX: {source: schwab, symbol: "$SPX", multiplier: 100, style: european, settlement: cash}
  XSP: {source: schwab, symbol: "$XSP", multiplier: 100, style: european, settlement: cash}
  SPY: {source: alpaca, symbol: "SPY",  multiplier: 100, style: american, settlement: physical}

rates:
  risk_free: 0.043
  dividend_yield: 0.013

expiry_selection:
  front_dte_min: 20
  front_dte_max: 40
  ratio_min: 1.7          # T2/T1
  ratio_max: 2.4
  prefer_pm_settled: true # avoid AM-settled 3rd-Friday monthlies for the front leg

strikes:
  target_deltas: [50, 38, 31, 25]   # ATM, 0.3σ, 0.5σ, 0.67σ
  sides: [call, put]                # calls above spot, puts below (OTM only)

regime:
  ivts_carry_max: 0.92      # Playbook A ceiling
  ivts_backwardation: 1.00  # Playbook B floor
  ivts_backwardation_strong: 1.05
  slope_z_window_days: 252
  slope_z_avoid_top_pct: 0.90   # skip carry entries in top decile of contango
  vix_lookback_median_days: 60
  rv_window_short: 10
  rv_window_long: 20

vol_shock_alpha:
  baseline: 0.50
  stress_cases: [0.35, 0.70]

gates:
  max_spread_pct_of_mid: 0.015     # per leg
  min_open_interest: 100
  max_debit_pct_of_nav: 0.015      # single position
  rv10_must_be_below_breakeven: true

targets:
  playbook_A: {profit_pct: 0.25, stop_pct: -0.35, distance_stop_sigma: 1.25, time_stop_dte: 10}
  playbook_B: {profit_pct: 0.50, stop_pct: -0.35, distance_stop_sigma: 1.25, time_stop_dte: 10}

exit_tree:
  # §5.9 step 6 (|net_delta| > delta_band -> HEDGE) isn't given a value in the build plan's
  # config block — not derivable from anything else, so added here rather than hardcoded.
  # Units match net_delta: (back_delta - front_delta) * multiplier * contracts; multiplier is
  # 100 for all three products, so this is roughly "shares of directional exposure per contract"
  # and comparable across SPX/XSP/SPY. Revisit once real position sizes are in.
  delta_band: 10

scenario_grid:
  spot_moves_sigma: [-2, -1, -0.5, 0, 0.5, 1, 2]
  iv_shifts_front: [-4, 0, 4, 10]
  iv_shifts_back:  [-2, 0, 2, 5]

schedule:
  run_times_et: ["09:45", "12:30", "15:30"]

nav: 100000   # for sizing display only

alerts:
  enabled: false
  channel: none   # none | email | pushover | slack
