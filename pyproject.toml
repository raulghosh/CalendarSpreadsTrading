[project]
name = "calscan"
version = "0.1.0"
description = "Calendar spread regime & scanner — decision support, no order placement"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.38",
    "plotly>=5.24",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "requests>=2.32",
    "schwab-py>=1.4",
    "alpaca-py>=0.33",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pandas-stubs",
    "types-requests",
    "types-pyyaml",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calscan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "schwab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
